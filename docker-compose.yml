services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      INTENTIONS_DB_PATH: /data/intentions.sqlite3
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-compose-key-change-before-deployment}
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - veritas-intentions:/data
    ports:
      - "8000:8000"

  prayer-api:
    build:
      context: .
      dockerfile: java/Dockerfile
    restart: unless-stopped
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_PRAYER_API_URL: http://localhost:8080/api
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - prayer-api

volumes:
  veritas-intentions:
