services:
  - type: web
    name: veritas-intentions-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        value: https://poonlonghei.github.io,https://www.chavezpoon.com
      - key: INTENTIONS_DB_PATH
        value: /data/intentions.sqlite3
  - type: web
    name: veritas-prayer-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./java/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://poonlonghei.github.io,https://www.chavezpoon.com

services:
- type: web
  name: veritas-prayer-api
  runtime: docker
  repo: https://github.com/poonlonghei/veritas
  plan: free
  envVars:
  - key: CORS_ALLOWED_ORIGINS
    sync: false
  region: oregon
  healthCheckPath: /health
  dockerContext: .
  dockerfilePath: ./java/Dockerfile
  autoDeployTrigger: commit