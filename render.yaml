services:
  - type: web
    name: veritas-prayer-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/prayers/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: CORS_ALLOWED_ORIGINS
        value: https://poonlonghei.github.io
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: veritas
